* { margin: 0; padding: 0; box-sizing: border-box; }
body {

  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
body::before {
  content: "";
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background:

    radial-gradient(circle at 85% 75%, rgba(255,183,77,0.10) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(165,214,167,0.08) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
.container {
  position: relative; z-index: 1;
  width: 100%; max-width: 560px;
  padding: 20px;
}
.card {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  padding: 32px 28px;
  box-shadow: 0 8px 32px rgba(76,175,80,0.10), 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid rgba(129,199,132,0.25);
  text-align: center;
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.leaf-decor {
  position: fixed; pointer-events: none; z-index: 0; opacity: 0.3;
  font-size: 48px;
}
.leaf-decor.l1 { top: 8%; left: 5%; animation: sway 5s ease-in-out infinite; }
.leaf-decor.l2 { top: 12%; right: 6%; animation: sway 6s ease-in-out 1s infinite; font-size: 38px; }
.leaf-decor.l3 { bottom: 15%; left: 8%; animation: sway 7s ease-in-out 2s infinite; font-size: 42px; }
.leaf-decor.l4 { bottom: 10%; right: 5%; animation: sway 5.5s ease-in-out 0.5s infinite; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-8px); } }
h1 { font-size: 28px; color: #2e7d32; margin-bottom: 6px; text-shadow: 0 1px 2px rgba(46,125,50,0.08); }
h2 { font-size: 20px; color: #388e3c; margin-bottom: 16px; font-weight: 500; }
.subtitle { color: #6d8c6d; font-size: 14px; margin-bottom: 20px; line-height: 1.6; }
.bird-emoji { font-size: 56px; margin-bottom: 12px; display: block; }
.bird-name {
  font-size: 32px; font-weight: 700; color: #1b5e20;
  background: linear-gradient(135deg, #c8e6c9, #dcedc8);
  border-radius: 16px; padding: 16px 20px; margin: 16px 0;
  letter-spacing: 2px;
  border: 2px dashed #a5d6a7;
}
.options { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.option-btn {
  display: block; width: 100%; padding: 14px 18px;
  font-size: 16px; font-family: inherit;
  background: #fff;
  border: 2px solid #c8e6c9;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  color: #2e3d2e;
  text-align: center;
}
.option-btn:hover {
  background: #e8f5e9;
  border-color: #81c784;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(76,175,80,0.12);
}
.option-btn:active { transform: scale(0.98); }
.option-btn.correct {
  background: #c8e6c9 !important; border-color: #4caf50 !important;
  color: #1b5e20 !important; font-weight: 600;
}
.option-btn.wrong {
  background: #ffcdd2 !important; border-color: #ef5350 !important;
  color: #b71c1c !important;
}
.option-btn:disabled { pointer-events: none; opacity: 0.7; }
.progress-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.progress-bar {
  flex: 1; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #66bb6a, #43a047);
  border-radius: 4px; transition: width 0.4s ease;
}
.progress-text { font-size: 13px; color: #6d8c6d; white-space: nowrap; font-weight: 500; }
.score-circle {
  width: 100px; height: 100px; border-radius: 50%;
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 12px;
  border: 3px solid #a5d6a7;
}
.score-num { font-size: 36px; font-weight: 700; color: #2e7d32; }
.btn {
  display: inline-block; padding: 13px 32px;
  font-size: 16px; font-family: inherit; font-weight: 600;
  border: none; border-radius: 30px; cursor: pointer;
  transition: all 0.2s ease;
}
.btn-primary {
  background: linear-gradient(135deg, #66bb6a, #43a047);
  color: #fff;
  box-shadow: 0 4px 16px rgba(67,160,71,0.25);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(67,160,71,0.35);
}
.btn-secondary {
  background: #fff;
  color: #43a047;
  border: 2px solid #a5d6a7;
}
.btn-secondary:hover { background: #e8f5e9; }
.btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.feedback {
  margin-top: 12px; padding: 12px; border-radius: 12px;
  font-size: 15px; font-weight: 500;
  animation: fadeIn 0.3s ease;
}
.feedback.correct { background: #e8f5e9; color: #2e7d32; }
.feedback.wrong { background: #ffebee; color: #c62828; }
.result-icon { font-size: 64px; display: block; margin-bottom: 8px; }
.stars { font-size: 32px; margin: 8px 0; }
.stat-row {
  display: flex; justify-content: space-between; padding: 10px 16px;
  border-bottom: 1px solid #e8f5e9; font-size: 14px;
}
.stat-row:last-child { border-bottom: none; }
.stat-val { font-weight: 600; color: #2e7d32; }
.level-badge {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 13px; font-weight: 600; margin-bottom: 12px;
}
.level-badge.l1 { background: #fff3e0; color: #e65100; }
.level-badge.l2 { background: #e8eaf6; color: #283593; }
.level-badge.l3 { background: #fce4ec; color: #880e4f; }
/* Protection options */
.option-btn.prot-l1 { border-color: #ef9a9a; }
.option-btn.prot-l2 { border-color: #ffcc80; }
.option-btn.prot-none { border-color: #c8e6c9; }
.option-btn.prot-l1:hover { background: #ffebee; border-color: #ef5350; }
.option-btn.prot-l2:hover { background: #fff3e0; border-color: #ff9800; }
.option-btn.prot-none:hover { background: #e8f5e9; border-color: #81c784; }

.master-ceremony {
  position: relative; overflow: hidden;
}
.master-card {
  border-color: #ffd700 !important;
  box-shadow: 0 0 40px rgba(255,215,0,0.3), 0 8px 32px rgba(255,152,0,0.15) !important;
  background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,248,225,0.9)) !important;
}
.master-ribbon {
  font-size: 22px; font-weight: 700; color: #b8860b;
  background: linear-gradient(135deg, #ffd700, #ffec80, #ffd700);
  padding: 10px 24px; border-radius: 30px;
  display: inline-block; margin-bottom: 16px;
  box-shadow: 0 4px 16px rgba(255,215,0,0.4);
  animation: ribbonPulse 2s ease-in-out infinite;
}
@keyframes ribbonPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 16px rgba(255,215,0,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 6px 24px rgba(255,215,0,0.6); }
}
.master-score {
  border-color: #ffd700 !important;
  background: linear-gradient(135deg, #fff8e1, #ffecb3) !important;
  box-shadow: 0 0 30px rgba(255,215,0,0.35) !important;

/* Confetti */
.confetti-container {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 100; overflow: hidden;
}
.confetti {
  position: absolute; top: -10px;
  width: 10px; height: 10px;
  border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

.heart-btn {
  background: none; border: none; cursor: pointer;
  font-size: 22px; padding: 0 4px; vertical-align: middle;
  transition: transform 0.2s ease;
  line-height: 1;
}
.heart-btn:hover { transform: scale(1.3); }
.heart-btn.loved { animation: heartPop 0.3s ease; }
@keyframes heartPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }

.float-wish-btn {

.float-wish-btn button {

.float-wish-btn button:hover {
  background: #fce4ec;
  border-color: #f06292;
  box-shadow: 0 4px 16px rgba(216,27,96,0.15);
  transform: translateY(-2px);

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.25);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
.modal-card {
  background: #fff;
  border-radius: 20px;
  padding: 24px;
  max-width: 440px; width: 90%;
  max-height: 70vh;
  overflow-y: auto;
  box-shadow: 0 16px 48px rgba(0,0,0,0.12);
  border: 1px solid #e8e0e0;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;

.modal-close {

  padding: 4px 8px; border-radius: 8px;
  transition: all 0.2s ease;
}
.modal-close:hover { background: #fce4ec; color: #d81b60; }
.wish-list { display: flex; flex-direction: column; gap: 6px; }
.wish-item {

}
.wish-item:hover { background: #fce4ec; }
.wish-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: #f8bbd0; color: #fff;

.wish-remove {

  .card { padding: 20px 16px; border-radius: 18px; }

  h1 { font-size: 22px; }

var PER_LEVEL = [10, 10, 16];  // level 1: 10, level 2: 10, level 3: 16
var LEVEL_NAMES = ['第一关 · 识目大师', '第二关 · 辨科高手', '第三关 · 保护级别'];
var LEVEL_BADGES = ['l1', 'l2', 'l3'];

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// Pick N birds from a pool, avoiding recently-used ones where possible
function pickBirds(pool, count, usedSet) {
  // Split into unused and used
  var unused = [];
  var used = [];
  for (var i = 0; i < pool.length; i++) {
    if (usedSet.has(pool[i].cn)) {
      used.push(pool[i]);
    } else {
      unused.push(pool[i]);
    }
  }
  var picked;
  if (unused.length >= count) {
    picked = shuffle(unused).slice(0, count);
  } else {
    // Not enough unused, fill with used
    picked = shuffle(unused);
    var need = count - unused.length;
    picked = picked.concat(shuffle(used).slice(0, need));
  }
  // Mark as used
  for (var i = 0; i < picked.length; i++) {
    usedSet.add(picked[i].cn);
  }
  return picked;
}

// Check if bird name contains the core of its family name
function birdNameHintsFamily(bird) {
  var familyCore = bird.family.replace('科', '');
  if (familyCore.length < 2) return false;
  return bird.cn.indexOf(familyCore) >= 0;
}

function generateQuestions(level) {
  // Load recently-used birds from sessionStorage
  var usedSet;
  try {
    var raw = sessionStorage.getItem('ccb_used_birds');
    usedSet = raw ? new Set(JSON.parse(raw)) : new Set();
  } catch(e) { usedSet = new Set(); }

  if (level === 1) {
    // Reset used set on fresh game start (not mid-level transition)
    if (state.currentQ === 0 && state.answers[0].length === 0) {
      usedSet = new Set();
    }
    var picked = pickBirds(BIRD_DATA.birds, PER_LEVEL[0], usedSet);
    // Persist used set
    try { sessionStorage.setItem('ccb_used_birds', JSON.stringify(Array.from(usedSet))); } catch(e) {}
    return picked.map(function(bird) {
      var correct = bird.order;
      var wrongs = shuffle(BIRD_DATA.orders.filter(function(o) { return o !== correct; })).slice(0, 3);
      return { bird: bird.cn, correct: correct, options: shuffle(wrongs.concat([correct])) };
    });
  } else if (level === 2) {
    // Filter out birds whose name hints at the family
    var filtered = BIRD_DATA.birds.filter(function(b) { return !birdNameHintsFamily(b); });
    // If too few left, fall back to full pool
    if (filtered.length < PER_LEVEL[1]) filtered = BIRD_DATA.birds;
    var picked = pickBirds(filtered, PER_LEVEL[1], usedSet);
    try { sessionStorage.setItem('ccb_used_birds', JSON.stringify(Array.from(usedSet))); } catch(e) {}
    return picked.map(function(bird) {
      var correct = bird.family;
      var wrongs = shuffle(BIRD_DATA.families.filter(function(o) { return o !== correct; })).slice(0, 3);
      return { bird: bird.cn, correct: correct, options: shuffle(wrongs.concat([correct])) };
    });
  } else {
    // Level 3: 8 questions about 一级 birds, 8 about 二级 birds
    var pool1 = BIRD_DATA.birds.filter(function(b) { return b.protection === '一级'; });
    var pool2 = BIRD_DATA.birds.filter(function(b) { return b.protection === '二级'; });
    var picked1 = pickBirds(pool1, 8, usedSet);
    var picked2 = pickBirds(pool2, 8, usedSet);
    try { sessionStorage.setItem('ccb_used_birds', JSON.stringify(Array.from(usedSet))); } catch(e) {}
    var qs = [];
    for (var i = 0; i < picked1.length; i++) {
      qs.push({ bird: picked1[i].cn, correct: '国家一级保护', protection: '一级' });
    }
    for (var i = 0; i < picked2.length; i++) {
      qs.push({ bird: picked2[i].cn, correct: '国家二级保护', protection: '二级' });
    }
    return shuffle(qs);
  }
}

function startLevel(level) {
  state.level = level;
  if (level === 1) {
    // Fresh game: reset everything
    state.score = [0, 0, 0];
    state.answers = [[], [], []];
    state.wishlist = [];
  }
  state.questions = generateQuestions(level);
  state.currentQ = 0;
  state.answered = false;
  state.justAnswered = false;
  state.reviewTarget = null;
  render();
}

function answer(choice) {
  if (state.answered) return;
  state.answered = true;
  var q = state.questions[state.currentQ];
  var isCorrect = choice === q.correct;
  if (isCorrect) state.score[state.level - 1]++;
  state.answers[state.level - 1].push({
    bird: q.bird,
    correct: q.correct,
    chosen: choice,
    isCorrect: isCorrect,
  });
  state.justAnswered = true;
  render();
  // Auto-advance on correct after a short pause
  if (isCorrect) {
    setTimeout(function() { next(); }, 900);
  }
}

function goBack() {
  if (state.currentQ <= 0) return;
  state.justAnswered = false;
  // Save frontier if not already reviewing
  if (state.reviewTarget == null) {
    state.reviewTarget = state.currentQ;
  }
  state.currentQ--;
  state.answered = true; // already answered, show result
  render();
}

function goForward() {
  if (state.reviewTarget != null) {
    state.currentQ = state.reviewTarget;
    state.reviewTarget = null;
    state.justAnswered = false;
    // Check if this question was already answered
    var ans = state.answers[state.level - 1][state.currentQ];
    state.answered = (ans !== undefined);
    render();
  }
}

function toggleWish(birdName) {
  var idx = state.wishlist.indexOf(birdName);
  if (idx >= 0) {
    state.wishlist.splice(idx, 1);
  } else {
    state.wishlist.push(birdName);
  }
  // Update heart button directly without full re-render
  var heartBtn = document.querySelector('button[data-wish=\"' + birdName + '\"]');
  if (heartBtn) {
    var inWish = idx < 0; // was added
    heartBtn.innerHTML = inWish ? '❤️' : '🤍';
    heartBtn.title = inWish ? '取消想看' : '我想看！';
    if (inWish) {
      heartBtn.classList.add('loved');
    } else {
      heartBtn.classList.remove('loved');
    }
  }
  // Update floating wishlist count
  var floatBtn = document.querySelector('.float-wish-btn button');
  if (floatBtn) {
    floatBtn.innerHTML = '💝 我想看' + (state.wishlist.length > 0 ? '（' + state.wishlist.length + '）' : '');
  }
}

function next() {
  state.justAnswered = false;
  // Clear review mode if advancing past the frontier
  if (state.reviewTarget != null && state.currentQ + 1 > state.reviewTarget) {
    state.reviewTarget = null;
  }
  var total = PER_LEVEL[state.level - 1];
  if (state.currentQ + 1 >= total) {
    if (state.level < 3) {
      state.level++;
      state.questions = generateQuestions(state.level);
      state.currentQ = 0;
      state.answered = false;
      render();
    } else {
      renderFinal();
    }
  } else {
    state.currentQ++;
    state.answered = false;
    render();
  }
}

  // Back button (when not on first question)
  if (state.currentQ > 0) {
    html += '<div style="margin-top:12px;"><button class="btn btn-secondary" data-back="1" style="font-size:13px;padding:8px 20px;">⬅ 上一题</button></div>';
  }

  // Feedback
  if (state.answered) {
    var ans = state.answers[lvl - 1][state.currentQ];
    var fbClass = ans.isCorrect ? 'correct' : 'wrong';
    var fbIcon = ans.isCorrect ? '✅' : '❌';
    var fbMsg = ans.isCorrect
      ? '太棒了！「' + q.bird + '」属于<strong>' + q.correct + '</strong>'
      : '不对哦～「' + q.bird + '」属于<strong>' + q.correct + '</strong>';
    html += '<div class="feedback ' + fbClass + '">' + fbIcon + ' ' + fbMsg + '</div>';

    // Show forward/next button
    var isReviewing = (state.reviewTarget != null) && (state.currentQ < state.reviewTarget);
    if (isReviewing) {
      // Reviewing past question: show return button
      html += '<div style="margin-top:14px"><button class="btn btn-primary" data-forward="1">⬇ 回到当前题</button></div>';
    } else if (ans.isCorrect && state.justAnswered) {
      // Just answered correctly: auto-advance hint
      html += '<p style="margin-top:8px;font-size:12px;color:#81c784;">自动跳转中…</p>';
    } else {
      // Wrong answer or reviewing restored question: show manual next
      var isLast = state.currentQ + 1 >= total;
      var isLastLevel = lvl >= 3;
      var nextLabel = isLast ? (isLastLevel ? '查看成绩 →' : '进入下一关 →') : '下一题 →';
      html += '<div style="margin-top:14px"><button class="btn btn-primary" data-next="1">' + nextLabel + '</button></div>';
    }
  }

  // Floating wishlist button
  html += '<div class="float-wish-btn"><button class="btn btn-secondary" data-showwish="1" style="font-size:13px;padding:8px 16px;border-radius:20px;">💝 我想看' + (state.wishlist.length > 0 ? '（' + state.wishlist.length + '）' : '') + '</button></div>';

  html += '</div>';
  app.innerHTML = html;
}

function renderFinal() {
  var total = PER_LEVEL[0] + PER_LEVEL[1] + PER_LEVEL[2];
  var totalCorrect = state.score[0] + state.score[1] + state.score[2];
  var score100 = Math.round(totalCorrect / total * 100);

  var isMaster = score100 >= 90;

  var icon, msg, stars;
  if (score100 >= 90) { icon = '🏆'; msg = '猜猜Bird大师'; stars = '⭐⭐⭐⭐⭐'; }
  else if (score100 >= 70) { icon = '🎉'; msg = '非常厉害！'; stars = '⭐⭐⭐⭐'; }
  else if (score100 >= 50) { icon = '👍'; msg = '不错哦！'; stars = '⭐⭐⭐'; }
  else if (score100 >= 30) { icon = '📚'; msg = '继续加油！'; stars = '⭐⭐'; }
  else { icon = '🌱'; msg = '观鸟之路刚刚开始～'; stars = '⭐'; }

  var html = '';
  // Master award ceremony wrapper
  if (isMaster) {
    html += '<div class=\"master-ceremony\">';
    html += '<div class=\"confetti-container\">';
    for (var c = 0; c < 50; c++) {
      html += '<div class=\"confetti\" style=\"left:' + (Math.random() * 100) + '%;animation-delay:' + (Math.random() * 3) + 's;background:hsl(' + (Math.random() * 360) + ',80%,60%);animation-duration:' + (2 + Math.random() * 3) + 's;\"></div>';
    }
    html += '</div>';
  }

  html += '<div class=\"card' + (isMaster ? ' master-card' : '') + '\">';
  if (isMaster) {
    html += '<div class=\"master-ribbon\">🎖️ 猜猜Bird大师 🎖️</div>';
  }
  html += '<span class=\"result-icon\">' + icon + '</span>';
  html += '<h1>' + msg + '</h1>';
  html += '<div class=\"stars\">' + stars + '</div>';
  html += '<div class=\"score-circle' + (isMaster ? ' master-score' : '') + '\"><span class=\"score-num\">' + score100 + '<small style=\"font-size:18px;\"> / 100</small></span></div>';
  html += '<p style=\"color:#6d8c6d;font-size:14px;margin-bottom:16px;\">正确率 ' + score100 + '%</p>';

  html += '<div style="text-align:left;margin:12px 0;">';
  html += '<div class="stat-row"><span>🦅 第一关·识目</span><span class="stat-val">' + state.score[0] + ' / ' + PER_LEVEL[0] + '</span></div>';
  html += '<div class="stat-row"><span>🐦 第二关·辨科</span><span class="stat-val">' + state.score[1] + ' / ' + PER_LEVEL[1] + '</span></div>';
  html += '<div class="stat-row"><span>🛡️ 第三关·保护级别</span><span class="stat-val">' + state.score[2] + ' / ' + PER_LEVEL[2] + '</span></div>';
  html += '</div>';

  var allAnswers = [];
  var levelLabels = ['目', '科', '保护级别'];
  var levelStart = [0, PER_LEVEL[0], PER_LEVEL[0] + PER_LEVEL[1]];
  for (var l = 0; l < 3; l++) {
    for (var i = 0; i < state.answers[l].length; i++) {
      allAnswers.push({ a: state.answers[l][i], lbl: levelLabels[l] });
    }
  }

  html += '<div style="text-align:left;margin-top:16px;max-height:200px;overflow-y:auto;">';
  html += '<p style="font-weight:600;color:#2e7d32;font-size:14px;margin-bottom:8px;">📋 答题回顾</p>';
  for (var i = 0; i < allAnswers.length; i++) {
    var a = allAnswers[i].a;
    var icon2 = a.isCorrect ? '✅' : '❌';
    html += '<div style="font-size:13px;padding:4px 0;border-bottom:1px solid #f0f4f0;">' +
      icon2 + ' <strong>' + a.bird + '</strong> → ' + a.correct +
      (a.isCorrect ? '' : ' <span style="color:#c62828;">(你选了: ' + a.chosen + ')</span>') +
      ' <span style="color:#888;font-size:11px;">[' + allAnswers[i].lbl + ']</span>' +
      '</div>';
  }
  html += '</div>';

  // Wishlist summary on final screen
  if (state.wishlist.length > 0) {
    html += '<div style="margin-top:12px;"><button class="btn btn-secondary" data-showwishexport="1" style="font-size:13px;padding:8px 20px;">💝 我想看！（' + state.wishlist.length + '种）</button></div>';
  }

  html += '<div class="btn-group">';
  html += '<button class="btn btn-primary" data-replay="1">🔄 再来一局</button>';
  html += '</div>';
  html += '<p style="margin-top:20px;font-size:12px;color:#b0c8b0;">🐦 作者：Crowpaw@2026</p>';
  html += '<p style="margin-top:4px;font-size:11px;color:#c0d4c0;"><a href="https://github.com/Crowheart0/Water-redstart_the_chirping_viewer" target="_blank" style="color:#81c784;text-decoration:none;">📸 作者的选照片小助手，一起来看看吧～ 欢迎Star ⭐</a></p>';
  html += '</div>';
  if (isMaster) {
    html += '</div>'; // close master-ceremony
  }
  app.innerHTML = html;
}

// Global click handler for modal overlay background
document.addEventListener('click', function(e) {
  if (e.target.getAttribute && e.target.getAttribute('data-overlay') !== null) {
    hideWishlist();
  }
});

// Event delegation
app.addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var answerVal = btn.getAttribute('data-answer');
  if (answerVal) { answer(answerVal); return; }
  if (btn.getAttribute('data-wish') !== null) { toggleWish(btn.getAttribute('data-wish')); return; }
  if (btn.getAttribute('data-showwishexport') !== null) { showWishlist(true); return; }
  if (btn.getAttribute('data-showwish') !== null) { showWishlist(false); return; }
  if (btn.getAttribute('data-closewish') !== null) { hideWishlist(); return; }
  if (btn.getAttribute('data-delwish') !== null) { toggleWish(btn.getAttribute('data-delwish')); hideWishlist(); showWishlist(false); return; }
  if (btn.getAttribute('data-exportwish') !== null) { exportWishlist(); return; }
  if (btn.getAttribute('data-overlay') !== null) { hideWishlist(); return; }
  if (btn.getAttribute('data-forward') !== null) { goForward(); return; }
  if (btn.getAttribute('data-back') !== null) { goBack(); return; }
  if (btn.getAttribute('data-next') !== null) { next(); return; }
  if (btn.getAttribute('data-start') !== null) { startLevel(1); return; }
  if (btn.getAttribute('data-replay') !== null) { startLevel(1); return; }
});

renderStart();
</script>
